name: waypulse_app
description: "WayPulse - Aplicación de Navegación Inteligente estilo Waze con Mapbox y Rutas Eco-Dynamic"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Mapas y Geolocalizacion
  flutter_map: ^6.2.1
  flutter_map_cancellable_tile_provider: ^2.0.0
  latlong2: ^0.9.1
  geolocator: ^11.1.0
  flutter_compass: ^0.8.0
  wakelock_plus: ^1.2.8
  
  # HTTP & REST API
  dio: ^5.4.3+1
  
  # Audio & Speech
  flutter_tts: ^4.0.2
  
  # UI Components & Icons
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/styles/
